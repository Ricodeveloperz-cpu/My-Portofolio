<!-- Subscribe Tamzidan Mahdiyin di YouTube -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- AOS Animation -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap");

        * {
            padding: 0;
            margin: 0;
            font-family: "Poppins", sans-serif;
            box-sizing: border-box;
        }

        /* Body */
        body {
            width: 100%;
            min-height: 100vh;
            background-image: url("./img/background.jpg");
            background-size: cover;
            background-position: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Navbar */
        nav {
            width: 100%;
            height: 10vh;
            position: relative;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }

        .logo span {
            color: rgb(0, 123, 255);
            text-shadow: 0 0 10px rgb(0, 123, 255);
        }

        /* Hamburger Menu */
        .hamburg,
        .cancel {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 10px;
            color: white;
            display: none;
            font-size: clamp(2.5rem, 0.5rem + 5vw, 3rem);
        }

        /* Navigation Links */
        .nav-container .links {
            display: flex;
        }

        .nav-container .links a {
            font-size: 1.2rem;
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-weight: 550;
            transition: 0.3s linear;
        }

        .nav-container .links a:hover {
            color: rgb(0, 123, 255);
            border-bottom: 2px solid rgb(0, 123, 255);
        }

        .nav-container .links .active {
            color: rgb(0, 123, 255);
            border-bottom: 2px solid rgb(0, 123, 255);
        }

        /* Dropdown Menu */
        .dropdown {
            z-index: 1000;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            transform: translateY(-500px);
            width: 100%;
            height: auto;
            backdrop-filter: blur(4px) brightness(40%);
            -webkit-backdrop-filter: blur(4px) brightness(40%);
            box-shadow: 0 0 20px black;
            transition: 0.2s linear;
        }

        .dropdown .links a {
            display: flex;
            color: white;
            text-decoration: none;
            padding: 15px 0;
            justify-content: center;
            align-items: center;
            transition: 0.2s linear;
        }

        .dropdown .links a:hover {
            background-color: rgb(0, 123, 255);
        }

        /* Contact Section */
        .contact-container {
            width: 100%;
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .contact-content {
            width: 80%;
            max-width: 1200px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            border: 1px solid rgba(0, 123, 255, 0.2);
        }

        /* Contact Information */
        .contact-info {
            padding-right: 2rem;
        }

        .contact-header h1 {
            font-size: 2.5rem;
            color: rgb(0, 123, 255);
            text-shadow: 0 0 10px rgb(0, 123, 255);
            margin-bottom: 1.5rem;
        }

        .contact-header p {
            line-height: 1.6;
            color: #eeeeee;
        }

        .contact-details {
            margin-top: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            min-width: 50px;
            background: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1rem;
        }

        .contact-icon i {
            font-size: 1.5rem;
            color: rgb(0, 123, 255);
        }

        .contact-text h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .contact-text p {
            color: #cccccc;
            overflow-wrap: anywhere;
        }

        /* Contact Form */
        .contact-form form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input {
            height: 58px;
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: rgb(0, 123, 255);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
        }

        .form-group label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            color: #cccccc;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .form-group input:focus ~ label,
        .form-group input:valid ~ label,
        .form-group textarea:focus ~ label,
        .form-group textarea:valid ~ label {
            top: -0.5rem;
            left: 0.8rem;
            font-size: 0.8rem;
            padding: 0 0.5rem;
            background: rgb(15, 15, 20);
            color: rgb(0, 123, 255);
        }

        /* Submit Button */
        .submit-btn {
            padding: 1rem 2rem;
            background: rgb(0, 90, 220);
            border: 1px solid rgb(0, 123, 255);
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: transparent;
            color: rgb(0, 123, 255);
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.5);
            border: 2px solid rgb(0, 123, 255);
            transform: translateY(-2px);
        }

        /* Social Links */
        .social-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            background: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(0, 123, 255);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: rgb(0, 123, 255);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
        }

        /* Small Screen Height */
        @media (max-height: 800px) {
            body {
                min-height: 100vh;
            }

            .contact-container {
                min-height: 90vh;
            }
        }

        /* Tablet */
        @media (max-width: 884px) {
            nav .logo {
                position: absolute;
                top: 16px;
                left: 15px;
                font-size: 1.5rem;
            }

            .nav-container .links {
                display: none;
            }

            .hamburg,
            .cancel {
                display: block;
            }

            .contact-content {
                width: 90%;
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .contact-info {
                padding-right: 0;
            }
        }

        /* Mobile */
        @media (max-width: 640px) {
            .contact-container {
                padding: 1rem;
            }

            .contact-content {
                width: 100%;
                padding: 1.5rem;
                gap: 2rem;
            }

            .contact-header h1 {
                font-size: 2rem;
            }

            .contact-item {
                align-items: center;
            }

            .contact-icon {
                margin-right: 1rem;
                margin-bottom: 0;
            }

            .contact-text h3 {
                font-size: 1rem;
            }

            .contact-text p {
                font-size: 0.9rem;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
            }

            .submit-btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>

    <title>Contact - Portfolio Website</title>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">

            <div class="logo" data-aos="zoom-in" data-aos-duration="1500">
                Tamzidan <span>Mahdiyin</span>
            </div>

            <div class="links">
                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="100">
                    <a href="index.html">Home</a>
                </div>

                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="200">
                    <a href="about.html">About</a>
                </div>

                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="300">
                    <a href="skill.html">Skills</a>
                </div>

                <div class="link" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="400">
                    <a href="service.html">Service</a>
                </div>

                <div class="link active" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="500">
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </div>

        <!-- Hamburger -->
        <i class="fa-solid fa-bars hamburg"
            aria-label="Open navigation menu"
            role="button"
            tabindex="0"
            onclick="hamburg()"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();hamburg()}"></i>

        <!-- Dropdown -->
        <div class="dropdown">
            <div class="links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="skill.html">Skills</a>
                <a href="service.html">Service</a>
                <a href="contact.html">Contact</a>

                <i class="fa-solid fa-xmark cancel"
                    aria-label="Close navigation menu"
                    role="button"
                    tabindex="0"
                    onclick="cancel()"
                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cancel()}"></i>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <div class="contact-container">
        <div class="contact-content">

            <!-- Contact Information -->
            <div class="contact-info">

                <div class="contact-header"
                    data-aos="fade-right"
                    data-aos-duration="1500">

                    <h1>Get in Touch</h1>

                    <p>
                        Feel free to reach out to me for any questions
                        or opportunities.
                    </p>
                </div>

                <div class="contact-details">

                    <div class="contact-item"
                        data-aos="fade-right"
                        data-aos-duration="1500"
                        data-aos-delay="200">

                        <div class="contact-icon">
                            <i class="fas fa-phone"></i>
                        </div>

                        <div class="contact-text">
                            <h3>Phone</h3>
                            <p>+62 234 5678 9003</p>
                        </div>
                    </div>

                    <div class="contact-item"
                        data-aos="fade-right"
                        data-aos-duration="1500"
                        data-aos-delay="400">

                        <div class="contact-icon">
                            <i class="fas fa-envelope"></i>
                        </div>

                        <div class="contact-text">
                            <h3>Email</h3>
                            <p>contact@tamzidan.com</p>
                        </div>
                    </div>

                    <div class="contact-item"
                        data-aos="fade-right"
                        data-aos-duration="1500"
                        data-aos-delay="600">

                        <div class="contact-icon">
                            <i class="fas fa-location-dot"></i>
                        </div>

                        <div class="contact-text">
                            <h3>Location</h3>
                            <p>Bandung, Indonesia</p>
                        </div>
                    </div>
                </div>

                <!-- Social Media -->
                <div class="social-links"
                    data-aos="fade-up"
                    data-aos-duration="1500"
                    data-aos-delay="800">

                    <a href="#"
                        aria-label="LinkedIn"
                        title="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>

                    <a href="#"
                        aria-label="GitHub"
                        title="GitHub">
                        <i class="fab fa-github"></i>
                    </a>

                    <a href="#"
                        aria-label="Twitter"
                        title="Twitter">
                        <i class="fab fa-twitter"></i>
                    </a>

                    <a href="#"
                        aria-label="Instagram"
                        title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form"
                data-aos="fade-left"
                data-aos-duration="1500"
                data-aos-delay="200">

                <form action="https://formspree.io/f/mwppavbk" method="POST">

                    <div class="form-group">
                        <input type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required>

                        <label for="name">Your Name</label>
                    </div>

                    <div class="form-group">
                        <input type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>

                        <label for="email">Your Email</label>
                    </div>

                    <div class="form-group">
                        <input type="text"
                            id="subject"
                            name="subject"
                            required>

                        <label for="subject">Subject</label>
                    </div>

                    <div class="form-group">
                        <textarea id="message"
                            name="message"
                            required></textarea>

                        <label for="message">Your Message</label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i>
                        Send Message
                    </button>

                </form>
            </div>

        </div>
    </div>

    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>

    <script>
        // Initialize AOS
        AOS.init({
            offset: 0,
            duration: 1500,
            once: false
        });

        // Open Mobile Menu
        function hamburg() {
            const navbar = document.querySelector(".dropdown");
            navbar.style.transform = "translateY(0)";
        }

        // Close Mobile Menu
        function cancel() {
            const navbar = document.querySelector(".dropdown");
            navbar.style.transform = "translateY(-500px)";
        }

        // Close mobile menu after selecting a link
        document.querySelectorAll(".dropdown .links a").forEach(link => {
            link.addEventListener("click", cancel);
        });
    </script>

    <!-- Existing Project JavaScript -->
    <script src="./js/script.js"></script>

</body>
</html>
