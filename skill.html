<!-- Subscribe Tamzidan Mahdiyin di YouTube --><!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">

<style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap");

    * {
        padding: 0;
        margin: 0;
        font-family: "Poppins", sans-serif;
        box-sizing: border-box;
    }

    body {
        width: 100%;
        min-height: 100vh;
        background-image: url("./img/background.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        overflow-x: hidden;
        position: relative;
    }

    nav {
        width: 100%;
        height: 10vh;
        min-height: 70px;
        position: relative;
        z-index: 1000;
    }

    .nav-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    .logo {
        color: white;
        font-size: 2rem;
        font-weight: bold;
    }

    .logo span {
        color: rgb(0, 123, 255);
        text-shadow: 0 0 10px rgb(0, 123, 255);
    }

    .hamburg,
    .cancel {
        cursor: pointer;
        position: absolute;
        right: 15px;
        top: 10px;
        color: white;
        display: none;
        font-size: clamp(2.5rem, 0.5rem + 5vw, 3rem);
    }

    .nav-container .links {
        display: flex;
    }

    .nav-container .links a {
        font-size: 1.2rem;
        color: white;
        margin: 0 20px;
        text-decoration: none;
        font-weight: 550;
        transition: 0.3s linear;
    }

    .nav-container .links a:hover {
        color: rgb(0, 123, 255);
        border-bottom: 2px solid rgb(0, 123, 255);
        text-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
    }

    .nav-container .links .active a {
        color: rgb(0, 123, 255);
        border-bottom: 2px solid rgb(0, 123, 255);
    }

    .dropdown {
        z-index: 1001;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        transform: translateY(-120%);
        width: 100%;
        height: auto;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(0, 123, 255, 0.2);
        transition: transform 0.3s ease;
    }

    .dropdown .links {
        display: flex;
        flex-direction: column;
        padding: 20px 0;
    }

    .dropdown .links a {
        display: flex;
        color: white;
        text-decoration: none;
        padding: 15px 0;
        justify-content: center;
        align-items: center;
        transition: 0.2s linear;
    }

    .dropdown .links a:hover {
        background-color: rgb(0, 90, 220);
    }

    .dropdown .cancel {
        position: absolute;
        top: 10px;
        right: 15px;
    }

    /* Skills Section */

    .skills-container {
        width: 100%;
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        position: relative;
        z-index: 1;
    }

    .skills-content {
        width: 80%;
        max-width: 1200px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 123, 255, 0.2);
        border-radius: 20px;
        padding: 3rem;
        color: white;
        box-shadow: 0 0 30px rgba(0, 123, 255, 0.08);
    }

    .skills-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .skills-header h1 {
        font-size: 2.5rem;
        color: rgb(0, 123, 255);
        text-shadow: 0 0 10px rgba(0, 123, 255, 0.8);
        margin-bottom: 1rem;
    }

    .skills-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 2rem;
    }

    .skill-category {
        background: rgba(0, 123, 255, 0.1);
        border: 1px solid rgba(0, 123, 255, 0.2);
        border-radius: 15px;
        padding: 2rem;
        transition: all 0.3s ease;
    }

    .skill-category:hover {
        transform: translateY(-10px);
        border-color: rgb(0, 123, 255);
        box-shadow: 0 0 20px rgba(0, 123, 255, 0.4);
        background: rgba(0, 123, 255, 0.15);
    }

    .skill-category h2 {
        color: rgb(0, 123, 255);
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: center;
    }

    .skill-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .skill-item {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 123, 255, 0.1);
        border-radius: 10px;
        padding: 1rem;
    }

    .skill-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.5rem;
    }

    .skill-info h3 {
        font-size: 1rem;
        color: white;
    }

    .skill-info span {
        color: rgb(0, 123, 255);
        font-weight: 600;
    }

    .progress-bar {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 5px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        background: linear-gradient(
            90deg,
            rgb(0, 90, 220),
            rgb(0, 200, 255)
        );
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.6);
        transition: width 1.5s ease-in-out;
    }

    .skill-icon {
        font-size: 2rem;
        color: rgb(0, 123, 255);
        margin-bottom: 1rem;
        text-align: center;
        text-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
    }

    /* Responsive Tablet */

    @media (max-width: 1000px) {
        .skills-content {
            width: 95%;
            padding: 2rem;
        }

        .skills-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .nav-container .links a {
            margin: 0 10px;
            font-size: 1rem;
        }
    }

    @media (max-width: 884px) {
        nav .logo {
            position: absolute;
            top: 16px;
            left: 15px;
            font-size: 1.5rem;
        }

        .nav-container .links {
            display: none;
        }

        .hamburg {
            display: block;
        }
    }

    /* Responsive Mobile */

    @media (max-width: 440px) {
        .skills-container {
            padding: 1rem 0.5rem;
        }

        .skills-content {
            width: 100%;
            padding: 1.5rem 1rem;
        }

        .skills-grid {
            grid-template-columns: 1fr;
        }

        .skills-header {
            margin-bottom: 2rem;
        }

        .skills-header h1 {
            font-size: 1.8rem;
        }

        .skill-category {
            padding: 1.5rem;
        }

        .skill-category h2 {
            font-size: 1.3rem;
        }

        .skill-icon {
            font-size: 1.8rem;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
        }
    }
</style>

<title>Skills - Portfolio Website</title>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>

<script>
    AOS.init({
        offset: 0,
        once: true
    });

    function hamburg() {
        const navbar = document.querySelector(".dropdown");
        navbar.style.transform = "translateY(0)";
    }

    function cancel() {
        const navbar = document.querySelector(".dropdown");
        navbar.style.transform = "translateY(-120%)";
    }

    document.querySelectorAll(".dropdown .links a").forEach(function(link) {
        link.addEventListener("click", cancel);
    });
</script>
